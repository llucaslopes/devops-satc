name: Build

on:
  workflow_call:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Validar secrets do Docker Hub
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "::error::Configure os secrets DOCKER_USERNAME e DOCKER_PASSWORD em Settings → Secrets and variables → Actions."
            exit 1
          fi
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -f dockerfile -t ${{ secrets.DOCKER_USERNAME }}/satc-devops:${{ github.sha }} .

      - name: Push Docker image
        run: docker push docker.io/${{ secrets.DOCKER_USERNAME }}/satc-devops:${{ github.sha }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: docker.io/${{ secrets.DOCKER_USERNAME }}/satc-devops:${{ github.sha }}
          format: json
          output: trivy-results.json
          severity: MEDIUM,HIGH,CRITICAL

      - name: Upload Trivy results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results.json
          path: trivy-results.json

      - name: Analyze Trivy results
        run: |
          if [ ! -f trivy-results.json ]; then
            echo "Arquivo de resultados do Trivy não encontrado."
            exit 1
          fi
          VULN_COUNT_MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' trivy-results.json)
          VULN_COUNT_HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results.json)
          echo "Quantidade de vulnerabilidades médias: $VULN_COUNT_MEDIUM"
          echo "Quantidade de vulnerabilidades altas: $VULN_COUNT_HIGH"

          if [ "$VULN_COUNT_MEDIUM" -gt 50 ]; then
            echo "Pipeline bloqueada: mais de 50 vulnerabilidades médias encontradas."
            exit 1
          fi
          if [ "$VULN_COUNT_HIGH" -gt 50 ]; then
            echo "Pipeline bloqueada: mais de 50 vulnerabilidades altas encontradas."
            exit 1
          fi
